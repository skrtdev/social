[project]
name = "social-cli"
version = "0.1.0"
description = "CLI to fetch profile and post info from X, Instagram, and Facebook"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "curl_cffi>=0.7",
    "rich>=13.7",
]

[project.scripts]
social = "social_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["social_cli"]

[tool.pytest.ini_options]
markers = [
    "network: hits live X/Instagram/Facebook endpoints (opt-in: `pytest -m network`)",
]
# By default, exclude network tests from `pytest` runs.
addopts = "-m 'not network'"
