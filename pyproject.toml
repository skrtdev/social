[project]
name = "social-cli"
version = "0.1.0"
description = "CLI to fetch public social profile, post, business, search, and job info"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "curl_cffi>=0.7",
    "rich>=13.7",
]

[project.optional-dependencies]
# Enables Playwright-backed scroll pagination for FB photos/videos and IG feed.
# After `pip install '.[browser]'`, run `playwright install chromium`.
browser = ["playwright>=1.40"]

[project.scripts]
social = "social_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["social_cli"]

[tool.pytest.ini_options]
markers = [
    "network: hits live X/Instagram/Facebook/LinkedIn endpoints (opt-in: `pytest -m network`)",
]
# By default, exclude network tests from `pytest` runs.
addopts = "-m 'not network'"
